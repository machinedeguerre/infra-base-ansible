- name: Ensure sudo is installed
  ansible.builtin.apt:
    name: sudo
    state: present
    update_cache: true

- name: Configure sudoers for ansible user (passwordless)
  ansible.builtin.copy:
    dest: "/etc/sudoers.d/{{ bootstrap_ansible_user_name }}"
    content: "{{ bootstrap_sudoers_line }}\n"
    owner: root
    group: root
    mode: "0440"
    validate: "/usr/sbin/visudo -cf %s"
