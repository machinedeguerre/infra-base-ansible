---
- name: Install prerequisites for Docker repository
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - gnupg
    state: present
    update_cache: true

- name: Ensure /etc/apt/keyrings directory exists
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: Add Docker official GPG key
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/debian/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: "0644"
    force: false

- name: Determine dpkg architecture
  ansible.builtin.command: dpkg --print-architecture
  register: _docker_dpkg_arch
  changed_when: false

- name: Add Docker apt repository (deb822 format)
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/docker.sources
    mode: "0644"
    content: |
      Types: deb
      URIs: https://download.docker.com/linux/debian
      Suites: {{ ansible_facts['distribution_release'] }}
      Components: stable
      Architectures: {{ _docker_dpkg_arch.stdout }}
      Signed-By: /etc/apt/keyrings/docker.asc
  register: _docker_repo_added

- name: Install Docker packages
  ansible.builtin.apt:
    name: "{{ docker_packages }}"
    state: present
    update_cache: "{{ _docker_repo_added.changed }}"

- name: Enable and start Docker service
  ansible.builtin.systemd:
    name: docker
    enabled: true
    state: started

- name: Build list of all users to add to docker group
  ansible.builtin.set_fact:
    _docker_users: "{{ [user_mgmt_default_username] + (docker_additional_users | default([])) }}"

- name: Add users to docker group
  ansible.builtin.user:
    name: "{{ item }}"
    groups: docker
    append: true
  loop: "{{ _docker_users }}"
  loop_control:
    label: "{{ item }}"
