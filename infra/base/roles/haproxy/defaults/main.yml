---
# List of sites to serve through HAProxy. Each entry needs:
#   - name:      internal identifier (used for backend names, ACLs)
#   - domains:   one or more hostnames to match on the Host header
#   - upstreams: one or more URLs of backend servers (http or https)
#   - redirect:  alternative to upstreams — redirect all requests to this
#                URL prefix, preserving path and query string (any trailing
#                slash on the prefix is stripped). No backend is rendered.
#   - redirect_code: HTTP status for redirect (default 302)
#   - cert:      key into wildcard_certs dict (the wildcard domain name,
#                e.g. "example.com" for *.example.com)
#   - plain_http: true — serve the site on port 80 without TLS, instead of
#                cert. For hosts behind another TLS-terminating proxy. Plain
#                sites are exempt from the HTTP->HTTPS redirect, and no :443
#                frontend is rendered when no site has a cert.
#
# https upstreams are contacted with SNI/Host taken from the incoming Host
# header and without certificate verification (trusted network assumed).
#
# Example:
# haproxy_sites:
#   - name: app1
#     domains:
#       - app1.example.com
#     upstreams:
#       - http://192.0.2.10/
#     cert: example.com
#   - name: app2
#     domains:
#       - app2.example.com
#     upstreams:
#       - https://192.0.2.11/
#     plain_http: true
haproxy_sites: []

# Wildcard certificates. `infratool generate_wildcard_cert <domain>` writes
# one vault file per domain (group_vars/all/wildcard_cert.<domain>.vault.yml)
# with a uniquely named wildcard_cert_* variable; the role assembles them all
# into one dict at runtime. This legacy dict is still honored (and wins on
# conflicts): each key is the bare wildcard domain (e.g. "example.com"), each
# value { fullchain: <pem>, privkey: <pem> }. Avoid defining it in more than
# one group_vars file — dicts don't merge across files (last one wins).
wildcard_certs: {}

# Raw TCP port forwards (mode tcp). Each entry needs:
#   - name:           internal identifier (used for frontend/backend names)
#   - listen_port:    port to bind on this host
#   - upstream_host:  address to forward to
#   - upstream_port:  port on the upstream host
#   - listen_address: optional bind address (default "*", all interfaces) —
#                     use to pin a forward to one network leg
#
# Example (expose SSH on port 2222, forwarded to 192.0.2.10:22):
# haproxy_tcp_forwards:
#   - name: ssh_app1
#     listen_port: 2222
#     upstream_host: 192.0.2.10
#     upstream_port: 22
haproxy_tcp_forwards: []

haproxy_config_dir: /etc/haproxy
haproxy_certs_dir: /etc/haproxy/certs
