---
- name: Ensure certs directory exists
  ansible.builtin.file:
    path: "{{ haproxy_certs_dir }}"
    state: directory
    owner: root
    group: haproxy
    mode: "0750"

- name: Compute unique cert keys referenced by sites
  ansible.builtin.set_fact:
    _haproxy_active_certs: "{{ haproxy_sites | map(attribute='cert') | unique | list }}"

- name: Write combined PEM (fullchain + privkey) for each referenced cert
  ansible.builtin.copy:
    dest: "{{ haproxy_certs_dir }}/{{ item }}.pem"
    content: "{{ wildcard_certs[item].fullchain }}{{ wildcard_certs[item].privkey }}"
    owner: root
    group: haproxy
    mode: "0640"
  loop: "{{ _haproxy_active_certs }}"
  loop_control:
    label: "{{ item }}"
  no_log: true
  notify: Reload haproxy

- name: List wildcard cert PEM files that should exist
  ansible.builtin.set_fact:
    _haproxy_wanted_cert_files: "{{ _haproxy_active_certs | map('regex_replace', '^(.*)$', haproxy_certs_dir ~ '/\\1.pem') | list }}"

- name: Find any stale cert files in the certs directory
  ansible.builtin.find:
    paths: "{{ haproxy_certs_dir }}"
    patterns: "*.pem"
    file_type: file
  register: _haproxy_present_cert_files

- name: Remove stale cert files no longer referenced by any site
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ _haproxy_present_cert_files.files }}"
  loop_control:
    label: "{{ item.path }}"
  when: item.path not in _haproxy_wanted_cert_files
  notify: Reload haproxy
