---
# kubernetes — k3s via the official k3s.orchestration collection, plus
# declarative manifest management. Supports multiple clusters per project.
#
# Dependency: the k3s.orchestration collection (k3s-io/k3s-ansible), pinned
# by commit SHA in the project's collections/requirements.yml — same supply
# chain convention as infra.base itself.
#
# Inventory contract — one parent group per cluster, named k3s_<cluster>,
# with the children k3s_<cluster>_server (control plane) and
# k3s_<cluster>_agent (workers); every cluster group sits under the umbrella
# group k3s_cluster (playbook gate + drift_report). A single server node is
# a complete cluster. Example:
#
#   k3s_cluster:
#     children:
#       k3s_internal:
#         children:
#           k3s_internal_server: { hosts: { myinternalhost: } }
#           k3s_internal_agent: { hosts: {} }
#       k3s_public:
#         children:
#           k3s_public_server: { hosts: { web1: } }
#           k3s_public_agent: { hosts: { web2: } }
#
# Each cluster group sets its identity and token in its group_vars:
#   inventory/group_vars/k3s_<cluster>/main.yml: kubernetes_cluster: <cluster>
#   inventory/group_vars/k3s_<cluster>/kubernetes_token.vault.yml (generated
#   with `./infratool generate_kubernetes_token <cluster>`)
#
# Manifests: every *.yml/*.yaml under kubernetes_manifests_src (on the
# controller, jinja-templated) is deployed to the cluster's FIRST server's
# /var/lib/rancher/k3s/server/manifests/ as ansible-<name>. k3s applies and
# keeps them in sync automatically; removing a file from the source dir
# EMPTIES the deployed copy on the node (timestamped tombstone) — k3s then
# applies the empty set and deletes the resources. Never delete such a file
# by hand: k3s ignores file deletion and would leave the resources running.
# A later run removes the file and its Addon object automatically, once the
# Addon checksum proves k3s applied exactly that tombstone.
#
# Helm works through the same directory via k3s' built-in helm-controller —
# no helm binary needed anywhere. Example manifest:
#   apiVersion: helm.cattle.io/v1
#   kind: HelmChart
#   metadata: { name: mychart, namespace: kube-system }
#   spec:
#     repo: https://charts.example.org
#     chart: mychart
#     version: 1.2.3
#     targetNamespace: myapp
#     valuesContent: |-
#       someOption: true
# (HelmChartConfig customizes the charts k3s itself ships, e.g. traefik.)
#
# Secrets: manifest files are jinja-templated, so a kubernetes Secret
# manifest can reference vault-encrypted ansible variables — secrets live in
# ansible-vault like everything else. Escape literal {{ }} needed by k8s
# (rare) with {% raw %} ... {% endraw %}. For plain Opaque Secrets, prefer
# the generic vault-backed mechanism below (kubernetes_secrets, managed with
# `./infratool kubernetes_secret`) over hand-written Secret manifests.

# REQUIRED. Cluster name (also the suffix of its inventory groups). Set it in
# the cluster group's group_vars, e.g. kubernetes_cluster: internal.
kubernetes_cluster: ""

# Inventory group names for this cluster, derived from the cluster name.
kubernetes_server_group: "k3s_{{ kubernetes_cluster }}_server"
kubernetes_agent_group: "k3s_{{ kubernetes_cluster }}_agent"

# k3s version (pinned; bumping it is a deliberate decision — the collection
# upgrades a node when the installed version is older than this).
kubernetes_version: "v1.36.5+k3s1"

# REQUIRED. Cluster join token, shared by all nodes in the cluster. Generate
# once per cluster with `./infratool generate_kubernetes_token <cluster>`
# (vault-encrypted into inventory/group_vars/k3s_<cluster>/). Changing it
# later is disruptive: agents must re-join.
kubernetes_token: ""

# Encrypt kubernetes Secrets at rest in the datastore, enabled from day one
# (enabling later requires a migration). k3s generates and manages the key
# itself (/var/lib/rancher/k3s/server/cred/encryption-config.json); rotate
# with `k3s secrets-encrypt rotate-keys`.
kubernetes_secrets_encryption: true

# Extra command line args passed through to k3s server/agent.
kubernetes_extra_server_args: ""
kubernetes_extra_agent_args: ""

# Extra raw config.yaml content for the server (appended after the
# secrets-encryption setting above).
kubernetes_server_config_extra: ""

# containerd registry mirrors (k3s registries.yaml): map of registry host ->
# list of mirror endpoint URLs. Endpoints only — credentials never belong in
# this file; put an authenticating proxy inside the cluster instead (see the
# registry-proxy manifest pattern). containerd falls back to the real
# registry if every mirror fails. Changing this restarts k3s on the node:
# brief API outage, running workloads are unaffected.
# Example:
#   kubernetes_registry_mirrors:
#     git.example.org:
#       - "http://127.0.0.1:30500"
kubernetes_registry_mirrors: {}

# Directory with manifest sources, relative to the playbook dir (absolute
# paths work too) — or a list of such directories, e.g. a shared dir plus a
# per-cluster one. Filenames must be unique across all dirs (the basename is
# the deployed name). Missing directory simply means no manifests. Manifests
# are cluster-wide: they are deployed on the cluster's first server only.
kubernetes_manifests_src: "files/k3s-manifests/{{ kubernetes_cluster }}"

# Generic vault-backed kubernetes Secrets: a dict keyed
# "<namespace>/<secret-name>" of data-key -> value, rendered as Opaque
# Secrets through the manifests mechanism above (as ansible-vault-secrets.yml
# on the first server — always deployed; with nothing declared it renders
# empty and k3s deletes every Secret it created). Never set this in
# plaintext — it lives vault-encrypted in
# inventory/group_vars/k3s_<cluster>/kubernetes_secrets.vault.yml, managed
# with `./infratool kubernetes_secret
# set|generate|generate-ssh-keypair|get|copy|move|list|delete|check ...`.
# The vault holds concrete entries only — replication into other namespaces
# is declared in checked-in yml via kubernetes_secret_references below.
# Namespaces are NOT created here (deliberately: pruning this manifest must
# never delete a namespace) — the namespace is owned by the app's manifest,
# and k3s' deploy controller retries the Secret every 15s until it exists.
kubernetes_secrets: {}

# Checked-in contract for kubernetes_secrets (names and keys only, never
# values), set per cluster in
# inventory/group_vars/k3s_<cluster>/kubernetes_secrets_declared.yml.
# required: every listed key MUST exist in the vault — validated before
#   manifest deploy, missing entries are a hard error naming the infratool
#   command to run.
# optional: keys that MAY exist. Vault entries declared in neither are
#   flagged in the Reports step (playbooks/report.yml -> tasks_from:
#   secrets_report) as stale, with a ready-made delete command.
# generated: exactly like required, but the value is machine-generated with
#   `./infratool kubernetes_secret generate ...` (random, never typed or
#   seen by a human) — used for pure machine-to-machine credentials.
#   An ssh key pair is the same kind of machine-only credential but comes in
#   two halves, so it is created with `generate-ssh-keypair` instead (the
#   public half may land in another cluster's vault) and declared as
#   required: `check` then suggests the generic `set` for a missing half —
#   note the real command next to the declaration.
# Example:
#   kubernetes_required_secrets:
#     "forgejo/smtp-credentials": [username, password]
#   kubernetes_generated_secrets:
#     "appns/internal-api": [token]
#   kubernetes_optional_secrets:
#     "forgejo/webhook-extras": [slack_url]
kubernetes_required_secrets: {}
kubernetes_generated_secrets: {}
kubernetes_optional_secrets: {}

# DERIVED data keys: ssh known_hosts built from the host keys this repo
# already manages (host_vars/<host>/hostkeys.vault.yml -> sshd_host_keys,
# the same material the sshd role installs on those machines). The value is
# rendered at deploy time and never stored in the vault, so a host key
# rotation flows straight through — and a pod that tunnels somewhere can
# verify the host without anyone running ssh-keyscan and pasting the result.
# Where a key comes from is configuration, not a secret: declared in the
# checked-in yml next to the contract, like kubernetes_secret_references.
#
#   kubernetes_known_hosts_secrets:
#     "atom/sync-tunnel":
#       known-hosts: [jango]              # inventory host names
#     "ci/deploy-keys":
#       known-hosts:
#         - grogu                         # short form: ansible_host + name
#         - host: jango                   # long form: explicit patterns
#           addresses: [172.25.60.10, jango.example.org]
#
# One line per host key per host, with the addresses as the host pattern
# (short form: the host's ansible_host plus its inventory name). The keys
# may share a secret with vault-backed keys — the sync tunnel's private key
# comes from the vault, its known_hosts from here — but a data key can only
# have ONE source (asserted before deploy), and the named hosts must exist
# in the inventory with host keys in their vault.
kubernetes_known_hosts_secrets: {}

# --- traefik-config component -------------------------------------------------
# Redirect all plain http to https at the entrypoint.
# Set to false ONLY where TLS terminates upstream.
kubernetes_traefik_https_redirect: true

# Extra raw helm values for the traefik chart (yaml string), e.g.:
#   kubernetes_traefik_values_extra: |
#     service:
#       spec:
#         externalTrafficPolicy: Local
kubernetes_traefik_values_extra: ""

# --- smtp-relay component ----------------------------------------------------
# In-cluster SMTP relay (postfix via boky/postfix), deployed through the
# manifests mechanism as ansible-smtp-relay.yml. THE SWITCH is the client
# list: a non-empty list enables the component, emptying it again makes the
# tombstone prune delete the whole thing (including its namespace, which the
# component owns). For each client namespace <c> in the list:
#   - the vault must hold "<relay-ns>/smtp-auth-<c>" key password, created
#     with `./infratool kubernetes_secret generate <cluster> <relay-ns>
#     smtp-auth-<c> password` (validated before deploy, like any required
#     secret);
#   - a Secret "smtp" is rendered in <c>'s OWN namespace (and nowhere else)
#     with server/port/username/password; the username is mail@<c>.
# The relay itself requires "<relay-ns>/smtp-upstream" key url, an SMTP URL:
#   smtp://user:pass@host:587 (STARTTLS) or smtps://user:pass@host:465
#   (implicit TLS); user/pass URL-encoded if they contain reserved chars —
#   NOTE: decoding is form-style, so a literal '+' must be written %2B
#   (a bare '+' becomes a space).
# The relay Service (ClusterIP only) answers on ports 587 and 25 — the same
# authenticated plaintext listener; port 465 deliberately unsupported (it
# means implicit TLS, which needs a real server certificate).
# The derived vault requirements are part of the effective secrets contract
# (vars/main.yml), which `./infratool kubernetes_secret check` fetches via
# the secrets_contract entrypoint — the tool itself knows nothing about
# components.
kubernetes_smtp_relay_clients: []
# The relay's own namespace (pod + service). Rarely changed.
kubernetes_smtp_relay_namespace: "mail"
# Optional sender-domain restriction (ALLOWED_SENDER_DOMAINS). Empty list
# (default) = unrestricted (ALLOW_EMPTY_SENDER_DOMAINS): relaying is already
# gated by SASL auth, and the upstream provider enforces its own policy.
kubernetes_smtp_relay_sender_domains: []
# Pinned image; bumping it is a deliberate decision.
kubernetes_smtp_relay_image: "docker.io/boky/postfix:v5.1.0"

# Secret replication, declared in the same checked-in file: each entry
# "<ns>/<name>": "<target-ns>/<target-name>" renders a full copy of the
# target vault secret as a Secret in the referencing namespace. Where a
# secret is replicated is configuration, not a secret — it lives here, in
# plain yml, never in the vault. A reference must point at a concrete vault
# entry: dangling targets, reference chains, and a reference name colliding
# with a vault entry all fail the run before any manifest is deployed.
# A required/optional declaration on a reference name is satisfied by the
# target's keys.
# Example:
#   kubernetes_secret_references:
#     "forgejo/smtp-auth": mail/smtp-auth
kubernetes_secret_references: {}

# Where the cluster admin kubeconfig is fetched on the control node: a
# PROJECT-LOCAL file per cluster, deliberately not ~/.kube/config — kubectl
# in one project's dev shell must never be able to point at another
# project's cluster. The context/cluster/user in the file are renamed to the
# cluster name, so several cluster files combine cleanly in a colon-joined
# KUBECONFIG (exported by the project's dev shell; switch with
# `kubectl config use-context <cluster>`). Gitignore the files — they
# contain the cluster admin credentials.
kubernetes_kubeconfig: "{{ playbook_dir | dirname }}/.kubeconfig-{{ kubernetes_cluster }}"
