---
# Declarative manifests via k3s' own manifests directory: files placed there
# are applied and kept in sync by the AddonsController. k3s IGNORES file
# deletion ("Deleting files out of this directory will not delete the
# corresponding resources from the cluster"), so undeclared files are never
# removed — they are EMPTIED instead: k3s applies the empty set and deletes
# every resource the file created, and the emptied file stays behind as a
# tombstone. Our files are prefixed ansible- so the tombstoning below never
# touches k3s' bundled addons (traefik, coredns, ...).

# kubernetes_secret_references (checked-in yml) replicates vault secrets
# into other namespaces: "<ns>/<name>": "<target-ns>/<target-name>". Every
# reference must point at a concrete vault entry — dangling targets,
# reference chains and names colliding with vault entries fail here, before
# anything is deployed.
- name: Secret references must point at concrete secrets in the vault
  ansible.builtin.assert:
    that:
      - item.key not in kubernetes_secrets
      - item.key not in kubernetes_known_hosts_secrets
      - item.value not in kubernetes_secret_references
      - item.value in kubernetes_secrets or item.value in kubernetes_known_hosts_secrets
    fail_msg: >-
      kubernetes_secret_references entry {{ item.key }} -> {{ item.value }}
      is invalid: {{ 'the reference name collides with a concrete vault
      entry — remove one of them' if item.key in kubernetes_secrets
      else ('the reference name collides with a derived known_hosts entry —
      remove one of them' if item.key in kubernetes_known_hosts_secrets
      else ('the target is itself a reference — references must point at a
      concrete secret' if item.value in kubernetes_secret_references
      else 'the target exists neither in the vault nor as a derived
      known_hosts entry')) }}.
  loop: "{{ kubernetes_secret_references | dict2items }}"
  loop_control:
    label: "{{ item.key }} -> {{ item.value }}"

# Derived known_hosts keys (kubernetes_known_hosts_secrets): built from the
# host keys this repo manages for the named machines. Two ways to get it
# wrong, both caught here rather than as an empty file inside a pod:
# a data key with two sources, and a host without usable host keys.
- name: A data key may have only one source (vault, contract or known_hosts)
  ansible.builtin.assert:
    that:
      - (kubernetes_secrets.get(item.key) or {}).keys() | list
        | intersect(item.value) | length == 0
      - (_kubernetes_effective_required.get(item.key) or [])
        | union(_kubernetes_effective_generated.get(item.key) or [])
        | union(kubernetes_optional_secrets.get(item.key) or [])
        | intersect(item.value) | length == 0
    fail_msg: >-
      kubernetes_known_hosts_secrets {{ item.key }} declares key(s)
      {{ item.value | join(', ') }} that also
      {{ 'exist in the vault — delete them there, the derived value wins
      nothing by being stored twice'
         if ((kubernetes_secrets.get(item.key) or {}).keys() | list
             | intersect(item.value) | length > 0)
         else 'appear in the required/generated/optional contract — a derived
      key is satisfied by this declaration alone, so remove it there' }}.
  loop: "{{ _kubernetes_effective_known_hosts | dict2items }}"
  loop_control:
    label: "{{ item.key }}"

- name: known_hosts hosts must exist in the inventory with host keys
  ansible.builtin.assert:
    that:
      - item.host in hostvars and
        (hostvars[item.host].sshd_host_keys | default([])) | length > 0
    fail_msg: >-
      kubernetes_known_hosts_secrets {{ item.ref }} key '{{ item.key }}'
      names host {{ item.host }}, which
      {{ 'is not in the inventory' if item.host not in hostvars
         else 'has no sshd_host_keys in its vault (host_vars/'
              ~ item.host ~ '/hostkeys.vault.yml — generate them with
              `./infratool generate_sshd_hostkeys ' ~ item.host ~ '`)' }} —
      the Secret would get an empty known_hosts file.
  loop: "{{ _kubernetes_known_hosts_hosts }}"
  loop_control:
    label: "{{ item.ref }} key '{{ item.key }}' -> {{ item.host }}"

# Fail before anything is deployed when a required secret (the checked-in
# contract, kubernetes_required_secrets, plus what enabled components derive
# — see vars/main.yml) is missing from the vault (kubernetes_secrets): a
# Secret that never materializes would otherwise fail silently in k3s'
# deploy controller every 15s, visible only in cluster events. The loop
# asserts every pair so one run lists all gaps. References count as their
# target's keys (validated as sound above).
- name: Every required kubernetes Secret must exist in the vault
  ansible.builtin.assert:
    that:
      - item.1 in _kubernetes_entry
    fail_msg: >-
      Required kubernetes Secret missing in vault:
      {{ item.0.key }} key '{{ item.1 }}' — create it with
      `./infratool kubernetes_secret {{ _kubernetes_verb }}
      {{ kubernetes_cluster }}
      {{ item.0.key.split('/', 1) | join(' ') }} {{ item.1 }}`.
  vars:
    # Machine-generated entries (the generated category, checked-in or
    # component-derived) are created with `generate` instead of `set`.
    _kubernetes_verb: >-
      {{ 'generate'
         if item.1 in (_kubernetes_effective_generated[item.0.key] | default([]))
         else 'set' }}
    _kubernetes_entry: >-
      {{ (kubernetes_secrets[kubernetes_secret_references[item.0.key]] | default({}))
         if item.0.key in kubernetes_secret_references
         else (kubernetes_secrets[item.0.key] | default({})) }}
  loop: >-
    {{ _kubernetes_effective_required
       | combine(_kubernetes_effective_generated, list_merge='append_rp')
       | dict2items | subelements('value') }}
  loop_control:
    label: "{{ item.0.key }} key '{{ item.1 }}'"

- name: Wait for the kubernetes API to be ready
  ansible.builtin.command: k3s kubectl get --raw /readyz
  register: _kubernetes_readyz
  retries: 24
  delay: 5
  until: _kubernetes_readyz.rc == 0
  changed_when: false

- name: Collect manifest sources
  ansible.builtin.set_fact:
    _kubernetes_manifest_files: >-
      {%- set files = [] -%}
      {%- for glob in _kubernetes_src_dirs
            | product(['/*.yml', '/*.yaml']) | map('join') -%}
        {%- set _ = files.extend(lookup('ansible.builtin.fileglob', glob, wantlist=True)) -%}
      {%- endfor -%}
      {{ files | sort }}
  vars:
    _kubernetes_src_list: >-
      {{ [kubernetes_manifests_src] if kubernetes_manifests_src is string
         else kubernetes_manifests_src }}
    _kubernetes_src_dirs: >-
      {{ _kubernetes_src_list
         | map('regex_replace', '^(?!/)', playbook_dir ~ '/')
         | list }}

# The deployed filename and the prune bookkeeping both use the basename
# alone, so a basename may only occur in one source dir.
- name: Manifest basenames must be unique across source dirs
  ansible.builtin.assert:
    that:
      - >-
        _kubernetes_manifest_files | map('basename') | list | length
        == _kubernetes_manifest_files | map('basename') | unique | length
    fail_msg: >-
      kubernetes_manifests_src dirs contain colliding manifest basenames —
      every filename must be unique across all source dirs:
      {{ _kubernetes_manifest_files | join(', ') }}

- name: Deploy manifests
  ansible.builtin.template:
    src: "{{ item }}"
    dest: /var/lib/rancher/k3s/server/manifests/ansible-{{ item | basename }}
    owner: root
    group: root
    mode: "0600"
  loop: "{{ _kubernetes_manifest_files }}"
  loop_control:
    label: "{{ item | basename }}"

# Vault-backed Secrets (kubernetes_secrets + kubernetes_secret_references)
# render into one generated manifest through the same mechanism. ALWAYS
# deployed: with nothing declared it renders empty (comments only), and
# k3s' apply of the empty set deletes every Secret it created. no_log/diff
# off: the rendered file contains every secret value.
- name: Deploy vault-backed Secrets manifest
  ansible.builtin.template:
    src: vault_secrets.yml.j2
    dest: /var/lib/rancher/k3s/server/manifests/ansible-vault-secrets.yml
    owner: root
    group: root
    mode: "0600"
  no_log: true
  diff: false

# Collection-bundled optional manifests ("components", see vars/main.yml),
# rendered from role templates. no_log/diff off: a component may embed
# secret values (the smtp relay's env does).
- name: Deploy component manifests
  ansible.builtin.template:
    src: "{{ item.template }}"
    dest: /var/lib/rancher/k3s/server/manifests/ansible-{{ item.name }}.yml
    owner: root
    group: root
    mode: "0600"
  no_log: true
  diff: false
  loop: "{{ _kubernetes_components }}"
  loop_control:
    label: "{{ item.name }}"

- name: List deployed manifests
  ansible.builtin.find:
    paths: /var/lib/rancher/k3s/server/manifests
    patterns: "ansible-*"
  register: _kubernetes_deployed

# Never delete an undeclared manifest outright — k3s ignores file deletion
# and would leave the resources running. Two-phase prune instead:
#   1. First run: EMPTY the file (timestamped tombstone, so its sha256 is
#      unique to this exact write). k3s applies the empty set within ~15s
#      and deletes everything the file created.
#   2. Later runs: once the Addon's spec.checksum (updated only on a
#      successful apply) equals the tombstone's sha256 — proof k3s applied
#      exactly this file — remove the file and the Addon object.
# A missing Addon means k3s tracks nothing for the file: remove it too.
# File content is never printed (a not-yet-tombstoned file holds the real
# manifest, secrets included).
- name: Prune manifests no longer declared (empty, verify, then remove)
  ansible.builtin.shell: |
    set -eu
    f="/var/lib/rancher/k3s/server/manifests/{{ item }}"
    if ! head -n 1 "$f" | grep -q '^# ANSIBLE TOMBSTONE'; then
      umask 077
      cat > "$f" <<EOF
    # ANSIBLE TOMBSTONE (infra.base.kubernetes), emptied at $(date -u +%Y-%m-%dT%H:%M:%SZ).
    # This manifest is no longer declared. k3s ignores file deletion, so the
    # file was emptied instead: k3s applies the empty set and deletes the
    # resources it created. Once the Addon checksum confirms this exact file
    # was applied, a later ansible run removes the file and the Addon.
    EOF
      echo TOMBSTONED
      exit 0
    fi
    name="{{ item.split('.')[0] }}"
    sum="$(sha256sum "$f" | cut -d' ' -f1)"
    applied="$(k3s kubectl get addon -n kube-system "$name" \
      -o jsonpath='{.spec.checksum}' 2>/dev/null || echo MISSING)"
    if [ "$applied" = "$sum" ] || [ "$applied" = "MISSING" ]; then
      rm "$f"
      k3s kubectl delete addon -n kube-system "$name" --ignore-not-found >/dev/null
      echo REMOVED
    else
      echo WAITING
    fi
  register: _kubernetes_prune
  changed_when: _kubernetes_prune.stdout != 'WAITING'
  loop: >-
    {{ _kubernetes_deployed.files | map(attribute='path')
       | map('basename')
       | reject('in', (_kubernetes_manifest_files | map('basename')
                       | map('regex_replace', '^', 'ansible-') | list)
                      + ['ansible-vault-secrets.yml']
                      + (_kubernetes_components | map(attribute='name')
                         | map('regex_replace', '^(.*)$', 'ansible-\1.yml')
                         | list))
       | list }}
