---
# Tooling entrypoint (used by `./infratool kubernetes_secret check`): writes
# the EFFECTIVE secrets contract — the checked-in contract variables merged
# with what enabled components derive (vars/main.yml) — plus the vault's
# structure (entry names and key names only, NEVER values) as JSON to a
# local file on the controller. Invoked as:
#
#   ansible 'k3s_<cluster>' -m include_role \
#     -a 'name=infra.base.kubernetes tasks_from=secrets_contract' \
#     -e 'kubernetes_secrets_contract_dest=<local file>'
#
# No task here connects to any host (copy is delegated to localhost, the
# guard is pure vars), so this works without reaching the cluster. Vault
# decryption happens on the controller when ansible loads the group vars.

- name: Write the effective secrets contract (controller-local)
  ansible.builtin.copy:
    content: >-
      {{ {'required': _kubernetes_effective_required,
          'generated': _kubernetes_effective_generated,
          'optional': kubernetes_optional_secrets,
          'references': kubernetes_secret_references,
          'known_hosts': _kubernetes_effective_known_hosts,
          'vault': dict(kubernetes_secrets.keys()
                        | zip(kubernetes_secrets.values() | map('list')))}
         | to_nice_json }}
    dest: "{{ kubernetes_secrets_contract_dest }}"
    mode: "0600"
  delegate_to: localhost
  when: >-
    kubernetes_secrets_contract_dest | default('') | length > 0
    and inventory_hostname ==
        (groups[kubernetes_server_group] | default([]) | first | default(''))