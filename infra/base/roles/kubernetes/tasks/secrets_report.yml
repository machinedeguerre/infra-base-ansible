---
# Report-only entrypoint for the project's report.yml (include_role with
# tasks_from: secrets_report): lists vault-backed kubernetes Secrets
# (kubernetes_secrets) that the checked-in contract
# (kubernetes_required_secrets / kubernetes_optional_secrets in
# kubernetes_secrets_declared.yml) declares in neither section — stale
# entries that should be declared or deleted. Names and keys only, never
# values. Cluster-wide, so it runs on the cluster's first server only.
# Missing REQUIRED secrets are not reported here — they hard-fail the run
# before manifest deploy (manifests.yml) instead.

- name: Report undeclared vault secrets
  when: >-
    inventory_hostname ==
    (groups[kubernetes_server_group] | default([]) | first | default(''))
  block:
    - name: Collect vault secrets not in the declared contract
      ansible.builtin.set_fact:
        _kubernetes_undeclared_report: >-
          {%- set lines = [] -%}
          {%- for ref, data in kubernetes_secrets | dictsort -%}
          {%-   set declared = (kubernetes_required_secrets.get(ref) or [])
                             + (kubernetes_optional_secrets.get(ref) or []) -%}
          {%-   for key in data | sort -%}
          {%-     if key not in declared -%}
          {%-       set ns_name = ref.split('/', 1) -%}
          {%-       set _ = lines.append(
                      ref ~ " key '" ~ key ~ "': declare it in "
                      ~ "kubernetes_secrets_declared.yml, or remove it: "
                      ~ "./infratool kubernetes_secret delete "
                      ~ kubernetes_cluster ~ " " ~ ns_name[0] ~ " "
                      ~ ns_name[1] ~ " " ~ key) -%}
          {%-     endif -%}
          {%-   endfor -%}
          {%- endfor -%}
          {{ lines | join('\n') }}

    - name: Vault secrets not in the declared contract (stale? clean up)
      ansible.builtin.debug:
        msg: "{{ _kubernetes_undeclared_report.split('\n') }}"
      when: _kubernetes_undeclared_report | length > 0
