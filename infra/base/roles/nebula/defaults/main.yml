nebula_rotate_days: 60 # Generate new cert when 60 days remains on current cert.
nebula_cert_duration: "2160h" # New certs will be valid for 90 days
nebula_version: "1.10.3"
nebula_binary_path: /usr/local/bin/nebula

nebula_ip: "" # REQUIRED per host, IP only e.g. "172.24.1.1"
nebula_groups: [] # REQUIRED - must be set per host (list of group names, e.g. ['web', 'production'])

# Groups every managed node gets in addition to nebula_groups (deduplicated).
# "infra" grants node-to-node SSH in the firewall template (overlay-split
# hops). Override per host (e.g. []) to exclude a node. External devices
# (generate_nebula_bundle) do NOT inherit this - their groups stay explicit.
# Group semantics used by the firewall template:
#   sysop - admin devices; full access to hosts and routed subnets
#   infra - every ansible-managed node; grants node-to-node SSH
nebula_implicit_groups: ["infra"]

# Revoked certificate fingerprints (from `nebula-cert print`). Nebula has no
# CRL — adding a fingerprint here and running the playbook against all hosts
# is how a lost/compromised cert is revoked before it expires.
nebula_blocklist: []

nebula_lighthouse_ip: []

nebula_listen_port: 4242 # Defaults to non-standard port for Nebula

nebula_dir: /etc/nebula
nebula_pki_dir: /etc/nebula/pki

# Unsafe networks - subnets this host is authorized to route through Nebula.
# Configure on hosts that SERVE a non-Nebula subnet (e.g. Proxmox hosts with VM subnets).
# This is embedded in the host's Nebula certificate and requires cert regeneration on change.
# Example (on a Proxmox host that routes VM traffic):
# nebula_unsafe_networks:
#   - "172.25.1.0/24"
nebula_unsafe_networks: []

# Extra firewall groups allowed into specific unsafe networks, beyond the
# always-present sysop rule. Keyed by subnet (must match an entry in
# nebula_unsafe_networks on the same host). Note that forwarded traffic
# presents the FORWARDING node's cert identity: allowing "infra" into a VM
# subnet admits every managed node AND anything those nodes route (e.g. VMs
# behind another PVE gateway). Subnets not listed here stay sysop-only.
# Example (VM subnet open to managed nodes, admin LAN stays sysop-only):
# nebula_unsafe_networks_extra_groups:
#   "172.25.1.0/24": ["infra"]
nebula_unsafe_networks_extra_groups: {}

# Unsafe routes - route non-Nebula subnets through Nebula tunnels.
# Configure on hosts that need to REACH a non-Nebula subnet via a Nebula peer.
# Each entry needs:
#   - route: CIDR of the subnet to route (e.g. "172.25.1.0/24")
#   - via: Nebula IP of the host that can reach the subnet (e.g. "172.24.1.1")
# Example (on a laptop that needs to reach VMs on a Proxmox host):
# nebula_unsafe_routes:
#   - route: "172.25.1.0/24"
#     via: "172.24.1.1"
nebula_unsafe_routes: []

# LAN gateways - masquerade traffic arriving over the Nebula overlay out to
# local physical subnets. Configure on hosts that act as a gateway from the
# overlay into their LAN. Strictly one-way: LAN devices see the gateway's own
# LAN address (stateful NAT) and cannot initiate connections into the overlay.
# Each entry:
#   - subnet: CIDR of the local LAN to expose (e.g. "192.168.1.0/24")
#     iface: outgoing network interface on this host (e.g. "eno1")
# The subnet must also be listed in nebula_unsafe_networks on the same host
# (embedded in the cert and opens the sysop firewall rule), and peers need a
# matching entry in nebula_unsafe_routes to route the subnet via this host.
# Example:
# nebula_lan_gateways:
#   - subnet: "192.168.1.0/24"
#     iface: "eno1"
nebula_lan_gateways: []
