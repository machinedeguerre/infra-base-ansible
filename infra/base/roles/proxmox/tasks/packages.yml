---
- name: Update and upgrade base
  ansible.builtin.apt:
    update_cache: yes
    state: latest
    autoclean: yes
    autoremove: yes

- name: Installing Proxmox
  ansible.builtin.apt:
    pkg:
      - proxmox-ve
      - postfix
      - open-iscsi
      - ifupdown2
      - nftables
      - dnsmasq
    state: present
    update_cache: yes

- name: Remove Proxmox enterprise repo files (recreated by proxmox-ve package)
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/apt/sources.list.d/pve-enterprise.list
    - /etc/apt/sources.list.d/pve-enterprise.sources

- name: Remove os-prober package
  ansible.builtin.apt:
    name: os-prober
    state: absent

# rpcbind (portmapper) is only needed for NFS, which these hosts don't use.
# Mask it outright rather than binding it to localhost — a masked unit can't
# be started, so the localhost-only override that used to live here was both
# redundant and buggy (its restart handler ran after the mask tasks below and
# failed with "Unit rpcbind.service is masked").
- name: Stop and mask rpcbind socket
  ansible.builtin.systemd:
    name: rpcbind.socket
    state: stopped
    enabled: false
    masked: true

- name: Stop and mask rpcbind service
  ansible.builtin.systemd:
    name: rpcbind
    state: stopped
    enabled: false
    masked: true
