---
- name: Check if token file already exists
  ansible.builtin.stat:
    path: /etc/proxmox-token
  register: proxmox_token_file_stat

- name: Check if vault secrets are defined
  ansible.builtin.set_fact:
    proxmox_token_secrets_available: >-
      {{
        proxmox_token_secret is defined and
        root_password is defined
      }}

- name: Verify token file can be decrypted (if it exists)
  ansible.builtin.shell: |
    openssl enc -aes-256-cbc -d -salt -pbkdf2 -base64 -pass pass:"{{ proxmox_token_secret }}" -in /etc/proxmox-token 2>/dev/null | head -c 1
  register: proxmox_token_decrypt_test
  failed_when: false
  changed_when: false
  when:
    - proxmox_token_secrets_available | bool
    - proxmox_token_file_stat.stat.exists

- name: Determine if token needs to be recreated
  ansible.builtin.set_fact:
    proxmox_token_needs_recreation: >-
      {{
        not proxmox_token_file_stat.stat.exists or
        proxmox_token_decrypt_test.rc != 0 or
        proxmox_token_decrypt_test.stdout | length == 0
      }}
  when: proxmox_token_secrets_available | bool

- name: Get IP address of the proxmox interface
  ansible.builtin.shell: "ip -4 addr show {{ proxmox_interface }} | grep -oP '(?<=inet\\s)\\d+(\\.\\d+){3}'"
  register: proxmox_interface_ip
  changed_when: false
  failed_when: false
  when:
    - proxmox_token_secrets_available | bool
    - proxmox_token_needs_recreation | bool

- name: Fail if interface has no IP address
  ansible.builtin.fail:
    msg: "Interface {{ proxmox_interface }} does not exist or has no IP address"
  when:
    - proxmox_token_secrets_available | bool
    - proxmox_token_needs_recreation | bool
    - proxmox_interface_ip.rc != 0 or proxmox_interface_ip.stdout | length == 0

- name: Get Proxmox API ticket
  ansible.builtin.uri:
    url: "https://{{ proxmox_interface_ip.stdout }}:{{ proxmox_port }}/api2/json/access/ticket"
    method: POST
    body:
      username: "root@pam"
      password: "{{ root_password }}"
    body_format: json
    validate_certs: false
    status_code: [200]
  register: proxmox_ticket
  when:
    - proxmox_token_secrets_available | bool
    - proxmox_token_needs_recreation | bool

- name: Check if Proxmox API token already exists
  ansible.builtin.uri:
    url: "https://{{ proxmox_interface_ip.stdout }}:{{ proxmox_port }}/api2/json/access/users/root@pam/token/{{ proxmox_token_id }}"
    method: GET
    headers:
      CSRFPreventionToken: "{{ proxmox_ticket.json.data.CSRFPreventionToken }}"
      Cookie: "PVEAuthCookie={{ proxmox_ticket.json.data.ticket }}"
    validate_certs: false
    status_code: [200, 404]
  register: proxmox_token_check
  failed_when: false
  when:
    - proxmox_token_secrets_available | bool
    - proxmox_token_needs_recreation | bool
    - proxmox_interface_ip.stdout is defined
    - proxmox_ticket is succeeded

- name: Delete existing Proxmox API token if it exists
  ansible.builtin.uri:
    url: "https://{{ proxmox_interface_ip.stdout }}:{{ proxmox_port }}/api2/json/access/users/root@pam/token/{{ proxmox_token_id }}"
    method: DELETE
    headers:
      CSRFPreventionToken: "{{ proxmox_ticket.json.data.CSRFPreventionToken }}"
      Cookie: "PVEAuthCookie={{ proxmox_ticket.json.data.ticket }}"
    validate_certs: false
    status_code: [200, 404]
  register: proxmox_token_delete
  failed_when: false
  when:
    - proxmox_token_secrets_available | bool
    - proxmox_token_needs_recreation | bool
    - proxmox_interface_ip.stdout is defined
    - proxmox_ticket is succeeded
    - proxmox_token_check.status == 200

- name: Create Proxmox API token
  ansible.builtin.uri:
    url: "https://{{ proxmox_interface_ip.stdout }}:{{ proxmox_port }}/api2/json/access/users/root@pam/token/{{ proxmox_token_id }}"
    method: POST
    headers:
      CSRFPreventionToken: "{{ proxmox_ticket.json.data.CSRFPreventionToken }}"
      Cookie: "PVEAuthCookie={{ proxmox_ticket.json.data.ticket }}"
    body:
      privsep: 0
      comment: "{{ proxmox_token_comment }}"
    body_format: json
    validate_certs: false
    status_code: [200]
  register: proxmox_token_create
  changed_when: true
  when:
    - proxmox_token_secrets_available | bool
    - proxmox_token_needs_recreation | bool
    - proxmox_interface_ip.stdout is defined
    - proxmox_ticket is succeeded

- name: Extract secret part from newly created token
  ansible.builtin.set_fact:
    proxmox_token_secret_part: "{{ proxmox_token_create.json.data.value }}"
  when:
    - proxmox_token_secrets_available | bool
    - proxmox_token_needs_recreation | bool
    - proxmox_token_create is succeeded
    - proxmox_token_create.json is defined
    - proxmox_token_create.json.data is defined
    - proxmox_token_create.json.data.value is defined

- name: Encrypt token secret locally
  ansible.builtin.shell: |
    echo "{{ proxmox_token_secret_part }}" | openssl enc -aes-256-cbc -salt -pbkdf2 -base64 -pass pass:"{{ proxmox_token_secret }}"
  register: proxmox_token_encrypted
  delegate_to: localhost
  become: false
  when:
    - proxmox_token_secrets_available | bool
    - proxmox_token_needs_recreation | bool
    - proxmox_token_secret_part is defined

- name: Save encrypted token to host
  ansible.builtin.copy:
    dest: /etc/proxmox-token
    content: "{{ proxmox_token_encrypted.stdout }}"
    mode: "0600"
    owner: root
    group: root
  when:
    - proxmox_token_secrets_available | bool
    - proxmox_token_needs_recreation | bool
    - proxmox_token_encrypted is succeeded
    - proxmox_token_encrypted.stdout is defined
