# Template configuration
proxmox_template_name: "debian-13-template"
proxmox_template_description: "Debian 13 template built with Packer"

# VM configuration for template build
proxmox_template_vm_cpus: 2
proxmox_template_vm_memory: 2048 # MB
proxmox_template_vm_disk_size: "32G"
proxmox_template_vm_disk_storage: "local" # Proxmox storage pool (e.g. "local", "local-lvm", "zfspool")

# ISO configuration
# Must name an ISO that the proxmox role's proxmox_iso_files downloads —
# keep in sync with that default when bumping the Debian point release.
proxmox_template_iso_filename: "debian-13.4.0-amd64-netinst.iso"
proxmox_template_iso_path: "/var/lib/vz/template/iso"

# Proxmox API configuration
proxmox_template_api_node: "{{ inventory_hostname }}" # Proxmox node name
proxmox_template_api_user: "root@pam"
proxmox_template_api_token_id: "{{ proxmox_token_id | default('ansible-automation') }}" # From proxmox role, default to 'ansible-automation'
proxmox_template_api_token_file: "/etc/proxmox-token"
proxmox_template_api_token_secret_vault: "proxmox_token_secret" # Vault variable name
proxmox_template_api_port: "{{ proxmox_port | default(8006) }}" # Proxmox API port

# Network configuration
proxmox_template_network_bridge: "{{ proxmox_lan_bridge | default('vmbr1') }}" # From proxmox role
proxmox_template_interface: "{{ proxmox_interface | default('tun0') }}" # Proxmox interface for API access

# Packer configuration
proxmox_template_packer_version: "1.15.0"
proxmox_template_packer_install_path: "/usr/local/bin/packer"

# Preseed configuration
proxmox_template_preseed_mirror: "http://deb.debian.org/debian"
proxmox_template_preseed_mirror_directory: "/debian"
proxmox_template_preseed_locale: "en_US.UTF-8"
proxmox_template_preseed_timezone: "UTC"
proxmox_template_preseed_keyboard: "us"

# VM ID for template build (also used for cloud-init configuration)
proxmox_template_vm_id: 9000

# Cloud-init default configuration for cloned VMs
proxmox_template_ci_user: "user"
proxmox_template_ci_default_ip: "192.168.1.2/24"
proxmox_template_ci_upgrade: false
proxmox_template_ci_sshkeys_src: "files/pubkeys/sysops.pubkeys"

# Cloud-init packages
proxmox_template_cloud_init_packages:
  - cloud-init
  - qemu-guest-agent
