---
# update_password: always — the vault is the source of truth for root's
# password on every run, not just at user creation. A host whose root
# password was set manually (e.g. at OS install) is converged on next run.
- name: Set root password
  ansible.builtin.user:
    name: root
    # Stable per-host salt keeps the hash deterministic, so the task is
    # idempotent (no "changed" on every run now that update_password: always).
    password: "{{ root_password | password_hash('sha512', 65534 | random(seed=inventory_hostname) | string) }}"
    update_password: always
  when: root_password is defined
  no_log: true
