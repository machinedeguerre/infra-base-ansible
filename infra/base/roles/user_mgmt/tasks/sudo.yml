---
# On cloud-init VMs the default user also matches NOPASSWD in
# /etc/sudoers.d/90-cloud-init-users. That file is left in place on purpose:
# cloud-init recreates it whenever the instance-id changes (e.g. after a
# cloud-init config change + restart), so deleting it would need re-applying.
# Instead we rely on sudoers' last-match rule: sudoers.d is read in lexical
# order, digits sort before letters, so the per-user file written below is
# parsed later and its (passworded) entry wins.
- name: "Configure sudo (password or passwordless)"
  ansible.builtin.copy:
    dest: "/etc/sudoers.d/{{ item.username }}"
    content: |
      {{ item.username }} ALL=(ALL:ALL) {% if item.passwordless_sudo %}NOPASSWD:ALL{% else %}ALL{% endif %}
    owner: root
    group: root
    mode: "0440"
    validate: "/usr/sbin/visudo -cf %s"
  when: item.sudo
  loop: "{{ user_mgmt_all_users }}"

- name: "Remove sudo for non-sudo users"
  ansible.builtin.file:
    path: "/etc/sudoers.d/{{ item.username }}"
    state: absent
  when: not item.sudo
  loop: "{{ user_mgmt_all_users }}"
