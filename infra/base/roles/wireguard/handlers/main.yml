---
- name: Restart WireGuard
  ansible.builtin.systemd:
    name: wg-quick@{{ wireguard_interface }}.service
    state: restarted
    daemon_reload: true

- name: Reload WireGuard peers
  ansible.builtin.shell: wg syncconf {{ wireguard_interface }} <(wg-quick strip {{ wireguard_config_dir }}/{{ wireguard_interface }}.conf)
  args:
    executable: /bin/bash

- name: Reload nftables
  ansible.builtin.command: nft -f /etc/nftables.conf
  changed_when: true
